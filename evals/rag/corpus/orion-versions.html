<!doctype html>

  <head><meta charset="utf-8"><title>Orion 版本记录</title></head>
  <body>
    <h1>Orion 版本记录</h1>
    <p>Orion V1 于 2023 年发布，额定载荷为 80 千克。Orion V2 于 2025 年 3 月 1 日发布，将额定载荷提升到 120 千克。V2.1 于 2025 年 11 月 20 日发布，只更新导航固件，没有改变额定载荷。</p>
    <p>配置字段 legacy_retry 在 V2.1 中被弃用，替代字段为 request_retry_limit。</p>
  </body>
</html>
