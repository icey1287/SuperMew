    <h1>Orion 仓储机器人产品概览</h1>
    <p>Orion 是用于室内仓储搬运的自主移动机器人，不是无人机。Orion V2 的额定载荷为 120 千克，标准电池在持续搬运任务中的续航为 8 小时。Orion V2 于 2025 年 3 月 1 日正式发布。</p>
    <p>当前安全规范要求：触发急停后，驱动系统必须在 1 秒内进入无动力状态。</p>
